name: image-poster

# 画像カード付き投稿。1日1回、朝の市場サマリーとして
# autopilotから切り出して独立運用（autopilotの肥大化防止）

on:
  schedule:
    # 07:30 JST = 22:30 UTC (前日)
    - cron: '30 22 * * *'
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Japanese fonts
        run: sudo apt-get install -y fonts-noto-cjk fonts-noto-cjk-extra

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run image-poster
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: node agents/image-poster.js

      - name: Commit state changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git stash --include-untracked || true
          git pull --rebase origin master || true
          git stash pop || true
          git add data/post_history.json data/research_pool.json
          git diff --staged --quiet || git commit -m "chore: image-poster [$(date -u +%H:%M)]"
          git push || echo "push failed, will retry"
