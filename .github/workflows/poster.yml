name: poster

# autopilot がqueueに溜めた長文投稿を、1日4回ピックアップして投稿する
# 朝・昼・午後・夜の4枠で「ガッツリ投稿スキーム」の柱

on:
  schedule:
    # 09:00 JST = 00:00 UTC
    - cron: '0 0 * * *'
    # 12:00 JST = 03:00 UTC
    - cron: '0 3 * * *'
    # 15:00 JST = 06:00 UTC
    - cron: '0 6 * * *'
    # 20:00 JST = 11:00 UTC
    - cron: '0 11 * * *'
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run poster (1 long-form post from queue)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: node agents/poster.js

      - name: Commit state changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git stash --include-untracked || true
          git pull --rebase origin master || true
          git stash pop || true
          git add data/queue.json data/post_history.json
          git diff --staged --quiet || git commit -m "chore: poster [$(date -u +%H:%M)]"
          git push || echo "push failed, will retry"
